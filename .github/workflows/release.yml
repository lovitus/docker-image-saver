name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check source syntax and reproducibility
        run: |
          set -euo pipefail
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          awk '/<script>/{flag=1;next}/<\/script>/{flag=0}flag' web/index.html | node --check -
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Test
        run: |
          set -euo pipefail
          go vet ./...
          go test -race -count=1 ./...
          go test -shuffle=on -count=3 ./...

      - name: Build cross-platform binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          targets=$(go tool dist list | grep -E '^(linux|darwin|windows)/')
          echo "Building targets:"
          echo "$targets"

          while IFS= read -r target; do
            [ -z "$target" ] && continue
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi

            out="dist/dia_${GOOS}_${GOARCH}${EXT}"
            echo "-> $target"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" .
          done <<< "$targets"

          (cd dist && sha256sum * > checksums.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dia-binaries
          path: dist/*

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            index($0, "## " version) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
